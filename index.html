<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/app icon.png" />
    <!-- TODO: Set the document title to the name of your application -->
    <title>FlippedPos</title>
    <meta name="description" content="Access your FlippedPOS store, manage sales, track inventory, and grow your business.">
    <meta name="author" content="FlippedPOS" />

    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/app icon.png">
    <link rel="apple-touch-startup-image" href="/splash.png" />
    
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.error('Service worker registration failed:', err);
          });
        });
      }
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://app.flippedpos.com/" />
    <meta property="og:title" content="FlippedPOS Application Portal" />
    <meta property="og:description" content="Access your FlippedPOS store, manage sales, track inventory, and grow your business." />
    <meta property="og:image" content="https://flippedpos.com/logo.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FlippedPOS Application Portal" />
    <meta name="twitter:description" content="Access your FlippedPOS store, manage sales, track inventory, and grow your business." />
    <meta name="twitter:image" content="https://flippedpos.com/logo.png" />
</head>

  <body>
    <div id="custom-splash" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #000; z-index: 999999; display: flex; justify-content: center; align-items: center; transition: opacity 0.5s ease-out;">
      <img src="/splash.png" style="width: 100%; height: 100%; object-fit: cover;" alt="Splash Screen" />
    </div>
    
    <script>
      // Lock scrolling while splash screen is visible
      document.body.style.overflow = 'hidden';
      
      // Ensure it stays for exactly 3 seconds
      setTimeout(() => {
        const splash = document.getElementById('custom-splash');
        if (splash) {
          splash.style.opacity = '0';
          document.body.style.overflow = ''; // Restore scrolling
          setTimeout(() => splash.remove(), 500); // Remove from DOM after fade out
        }
      }, 3000);
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
